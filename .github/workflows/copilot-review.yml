name: "Copilot Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Copilot to finish reviewing
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "Waiting for Copilot to review PR #$PR..."

          for i in $(seq 1 24); do
            sleep 20

            REVIEWS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer")] | length')
            COMMENTS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
              --jq '[.[] | select(.user.login == "Copilot") | select(.in_reply_to == null)] | length')

            echo "  [$i] Reviews: $REVIEWS  Comments: $COMMENTS"

            if [ "$REVIEWS" -gt 0 ] || [ "$COMMENTS" -gt 0 ]; then
              echo "✅ Copilot has reviewed PR #$PR"
              exit 0
            fi
          done

          # Copilot didn't review — post a reminder comment
          echo "⚠️  Copilot has not reviewed yet. Posting reminder..."

          gh pr comment "$PR" --body "> [!NOTE]
          > 👉 Copilot hasn't reviewed this PR yet.
          > Click **Re-review** on the PR page to trigger it:
          > https://github.com/$GITHUB_REPOSITORY/pull/$PR"

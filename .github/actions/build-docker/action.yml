name: "Build and push Docker images"
description: "Build all agent Dockerfiles and push to ghcr.io with the given tag suffix"

inputs:
  suffix:
    description: "Docker tag suffix, e.g. v0.2.0-rc.1 or v0.2.0"
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.agy
        push: true
        tags: ghcr.io/${{ github.repository }}/antigravity:${{ inputs.suffix }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.copilot
        push: true
        tags: ghcr.io/${{ github.repository }}/copilot:${{ inputs.suffix }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

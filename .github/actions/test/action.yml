name: "Run Rust tests and clippy"
description: "cargo test --workspace && cargo clippy -- -D warnings"

inputs:
  toolchain:
    default: "1.96"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master  # TODO: pin to a stable version once we settle on one
      with:
        toolchain: ${{ inputs.toolchain }}
        components: clippy

    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

    - shell: bash
      run: cargo test --workspace

    - shell: bash
      run: cargo clippy --workspace -- -D warnings

name: "Wait for Copilot review"
description: "Request Copilot review then poll for result; post reminder if timeout"

inputs:
  timeout_minutes:
    default: "8"
  poll_seconds:
    default: "20"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TIMEOUT: ${{ inputs.timeout_minutes }}
        SLEEP: ${{ inputs.poll_seconds }}
      run: |
        # Fork PRs: GITHUB_TOKEN is read-only, Copilot can't review.
        # Bail out early — required check won't block merge on forks.
        REPO_FULL=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.fork')
        if [ "$REPO_FULL" = "true" ]; then
          echo "::warning::Fork PR detected — skipping Copilot review (token is read-only)"
          exit 0
        fi

        # Request Copilot as reviewer (best-effort)
        echo "Requesting Copilot review..."
        gh pr edit "$PR" --add-reviewer copilot-pull-request-reviewer 2>/dev/null || \
        gh pr edit "$PR" --add-reviewer Copilot 2>/dev/null || true
        sleep 10

        max=$(( TIMEOUT * 60 / SLEEP ))
        echo "Polling Copilot for up to ${TIMEOUT}m (${max} × ${SLEEP}s)..."
        echo "HEAD_SHA=$HEAD_SHA"

        for i in $(seq 1 $max); do
          sleep "$SLEEP"

          # Use --jq to emit one .id per matching review, then wc -l to count.
          # Avoids --paginate × --jq 'length' breaking on multi-page responses.
          REVIEWS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.login | test("copilot"; "i")) | select(.commit_id == "'"$HEAD_SHA"'") | .id' \
            | wc -l | tr -d ' ')

          echo "  [$i] reviews=$REVIEWS"
          if [ "$REVIEWS" -gt 0 ]; then
            echo "✅ Copilot reviewed PR #$PR"
            exit 0
          fi
        done

        echo "⚠️  Timeout — posting reminder."
        gh pr comment "$PR" --body "Copilot hasn't reviewed this PR yet. Click 'Re-review': https://github.com/$GITHUB_REPOSITORY/pull/$PR" || true
        echo "::error::Copilot did not review this PR within ${TIMEOUT}m"
        exit 1

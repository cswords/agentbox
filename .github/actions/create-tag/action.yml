name: "Create and push git tag"
description: "Create an annotated git tag and push it"

inputs:
  tag:
    description: "Tag name, e.g. v0.2.0-rc.1"
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "$TAG"
        git push origin "$TAG"
        echo "Pushed tag: $TAG"
